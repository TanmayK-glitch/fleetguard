seed: 42
paths:
  raw: data/raw
  processed: data/processed
  incoming: data/incoming
  models: artifacts/models
  reports: artifacts/reports
cleaning:
  smoothing: ewma         # ewma or rolling_median, both trailing only
  ewma_alpha: 0.3
  median_window: 5
  min_sensor_std: 0.01    # measured on cleaned TRAIN sensors in original units
features:
  windows: [5, 10, 30]
  baseline_cycles: 10     # prefix mean until this cycle, then frozen
target:
  rul_cap: 125
training:
  cv_splits: 5
  cv_shuffle: true
  selection_metric: rmse
  clip_predictions: true   # bound model outputs to 0..rul_cap; test truth stays uncapped
  n_jobs: 2
  models: [ridge, random_forest, lightgbm]
  ridge:
    alpha: 10.0
    solver: cholesky
  random_forest:
    n_estimators: 100
    max_depth: 12
    min_samples_leaf: 5
    max_features: 0.7
  lightgbm:
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    max_depth: -1
    min_child_samples: 30
    reg_lambda: 1.0
    subsample: 1.0
    colsample_bytree: 1.0
